name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Окно анализа совпадает с рамкой MVP
        run: python contracts/check_window_config.py
      - name: Скрипты ml и contracts компилируются
        run: python -m compileall -q ml contracts
